apiVersion: v1
kind: Namespace
metadata:
  name: kajian-ihsan
  labels:
    app.kubernetes.io/name: kajian-ihsan
    environment: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kajian-ihsan-config
  namespace: kajian-ihsan
data:
  NODE_ENV: "production"
  PORT: "3005"
  CLUSTER_MODE: "false" # In K8s, container-level 1 pod = 1 main process is standard best practice; HPA scales pods
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "400"
  CACHE_TTL_MS: "3600000"
  MAX_QUEUE_CONCURRENCY: "4"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kajian-ihsan-app
  namespace: kajian-ihsan
  labels:
    app: kajian-ihsan
    tier: api-core
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kajian-ihsan
  template:
    metadata:
      labels:
        app: kajian-ihsan
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3005"
        prometheus.io/path: "/api/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - kajian-ihsan
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: core-api
          image: kajian-ihsan:2.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kajian-ihsan-config
          ports:
            - containerPort: 3005
              name: http
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: kajian-ihsan-svc
  namespace: kajian-ihsan
  labels:
    app: kajian-ihsan
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3005
      protocol: TCP
      name: http
  selector:
    app: kajian-ihsan
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kajian-ihsan-hpa
  namespace: kajian-ihsan
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kajian-ihsan-app
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
