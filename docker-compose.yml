version: '3.8'

services:
  kajian-ihsan-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: kajian-ihsan:2.0.0
    container_name: kajian-ihsan-core
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - CLUSTER_MODE=true
      - WORKERS=4
      - PORT=3005
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=400
      - CACHE_TTL_MS=3600000
      - MAX_QUEUE_CONCURRENCY=4
    deploy:
      resources:
        limits:
          cpus: '4.00'
          memory: 4096M
        reservations:
          cpus: '1.00'
          memory: 1024M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/api/healthz').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
